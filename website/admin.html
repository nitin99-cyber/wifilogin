<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | MMMUT WiFi</title>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { font-family: 'Space Grotesk', sans-serif; color: #ff00cc; }
    .glass-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      max-width: 800px;
      width: 100%;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-box {
      background: #111;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-num { font-size: 2.5rem; font-weight: bold; color: #00d2ff; }
    #dashboard { display: none; }
    .review-item { border-bottom: 1px solid #333; padding: 10px 0; }
    .error { color: #ff00cc; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Admin Access</h1>

  <div id="login-container" class="glass-card">
    <p>Please log in to view analytics.</p>
    <p class="error" id="login-error"></p>
    <input type="email" id="email" placeholder="Admin Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="login-btn">Login</button>
  </div>

  <div id="dashboard" class="glass-card">
    <h2>Analytics Dashboard</h2>
    <button id="logout-btn" style="width: auto; margin-bottom: 20px; padding: 8px 16px;">Logout</button>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div>Profile Visits</div>
        <div class="stat-num" id="val-visits">0</div>
      </div>
      <div class="stat-box">
        <div>Downloads</div>
        <div class="stat-num" id="val-downloads">0</div>
      </div>
      <div class="stat-box">
        <div>Avg Rating</div>
        <div class="stat-num" id="val-rating">0.0</div>
      </div>
    </div>

    <h2>Recent Reviews</h2>
    <div id="reviews-list">Loading...</div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
